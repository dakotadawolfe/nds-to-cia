name: Build and verify
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: devkitpro/devkitarm@sha256:a998edf6b06416b5c053edbcd879abfa22b1b88e9cd3f267f5c4ee9fec71a93a
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install host tools
        run: |
          printf '%s\n' \
            'deb [check-valid-until=no] https://snapshot.debian.org/archive/debian/20250901T000000Z/ bullseye main' \
            'deb [check-valid-until=no] https://snapshot.debian.org/archive/debian-security/20250901T000000Z/ bullseye-security main' \
            > /tmp/nds-build.list
          apt-get -o Dir::Etc::sourcelist=/tmp/nds-build.list -o Dir::Etc::sourceparts=- update
          apt-get -o Dir::Etc::sourcelist=/tmp/nds-build.list -o Dir::Etc::sourceparts=- install -y --no-install-recommends gcc g++ libpng16-16 git
      - name: Build runtime and tests
        run: bash build.sh
      - name: Package corresponding source
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 scripts/source_archive.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-build
          path: dist-v2/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: corresponding-source
          path: release/*Source.zip
  windows:
    needs: runtime
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: runtime-build
          path: dist-v2
      - run: python -m pip install -r requirements-build.txt
      - run: python scripts/build_windows.py
      - uses: actions/download-artifact@v4
        with:
          name: corresponding-source
          path: release
      - name: Test the packaged executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ./release/NDS-to-CIA.exe -ArgumentList '--self-test --state-dir build/test-profile --report build/self-test.json' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { Get-Content build/self-test.json; throw 'EXE self-test failed' }
          $process = Start-Process -FilePath ./release/NDS-to-CIA.exe -ArgumentList 'dist-v2/Storage-Probe.nds --output build/Probe.cia --basic-banner --state-dir build/test-profile --report build/conversion-test.json' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { Get-Content build/conversion-test.json; throw 'EXE conversion failed' }
          python -c "from pathlib import Path; from verify import verify_cia; verify_cia(Path('build/Probe.cia'))"
      - run: python scripts/package_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-release
          path: |
            release/NDS-to-CIA.exe
            release/Bridge.cia
            release/*Windows-x64.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-test-results
          path: build/*test.json
